# Herdr Configuration
# Terminal multiplexer for AI coding agents
# https://herdr.dev/docs/configuration/
#
# Ported from tmux configuration with equivalent keybindings where applicable.
# Run `herdr --default-config` to see all available options.

# Skip first-run onboarding (we've already configured everything)
onboarding = false

# =============================================================================
# Theme Configuration
# =============================================================================
# Matching the Catppuccin Mocha theme from tmux config
[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

# =============================================================================
# Terminal Settings
# =============================================================================
[terminal]
# Follow current pane's directory when creating new panes/tabs (like tmux default)
new_cwd = "follow"
# Auto-detect login shell for proper PATH setup (important for SDKMAN, Homebrew, etc.)
shell_mode = "auto"

# =============================================================================
# Keybindings
# =============================================================================
# Ported from tmux.conf with same prefix key (ctrl+b)
[keys]
# Prefix key - same as tmux default
prefix = "ctrl+b"

# Vim-style pane navigation (matching tmux: bind h/j/k/l select-pane)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Tab/window switching (matching tmux: Shift+Arrow)
# Note: Herdr uses "tabs" where tmux uses "windows"
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]

# Split panes - similar to tmux vertical/horizontal splits
# prefix+v for vertical split (side by side) - matches tmux bind 'v' copy-mode
split_vertical = "prefix+v"
# prefix+minus for horizontal split (stacked)
split_horizontal = "prefix+minus"

# Config reload (matching tmux: bind r source-file)
reload_config = "prefix+shift+r"

# Copy mode (matching tmux: bind 'v' copy-mode)
copy_mode = "prefix+["

# Pane/tab management
close_pane = "prefix+x"
close_tab = "prefix+shift+x"
new_tab = "prefix+c"

# Zoom/fullscreen toggle (matching tmux: prefix+z)
zoom = "prefix+z"

# Detach from session (matching tmux: prefix+d behavior)
detach = "prefix+q"

# Workspace navigation
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"

# Session navigation
goto = "prefix+g"

# Indexed workspace/tab switching (prefix+1-9 for tabs, prefix+shift+1-9 for workspaces)
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"

# Help
help = "prefix+?"
settings = "prefix+s"

# =============================================================================
# UI Configuration
# =============================================================================
[ui]
# Mouse support enabled (matching tmux: set -g mouse on)
mouse_capture = true
copy_on_select = true

# Pane visual settings
pane_borders = true
pane_gaps = true
pane_scrollbars = true

# Sidebar settings
sidebar_start_collapsed = false

# Confirm before closing workspace (safety feature)
confirm_close = true

# Tab bar position
tab_bar_position = "top"

# =============================================================================
# Notification Settings
# =============================================================================
# Terminal notifications work well for SSH sessions (matching tmux workflow)
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

# =============================================================================
# Sound Notifications
# =============================================================================
[ui.sound]
enabled = true

# =============================================================================
# Custom Command Bindings
# =============================================================================
# Custom keybindings for common workflows
# Reference: https://herdr.dev/docs/configuration/#custom-command-keybindings

# Lazygit popup - quick git operations in a floating pane
[[keys.command]]
key = "prefix+shift+g"
command = "lazygit"
popup = true
popup_title = "lazygit"

# htop system monitor popup
[[keys.command]]
key = "prefix+shift+h"
command = "htop"
popup = true
popup_title = "htop"

# Quick directory switching with fzf
# Uses fd to find directories and fzf to select, then cd's to the selection
[[keys.command]]
key = "prefix+shift+f"
command = "cd \"$(fd --type d --hidden --exclude .git --exclude node_modules | fzf --preview 'ls -la {}')\" && exec $SHELL"
popup = true
popup_title = "Find Directory"

# Project file finder with fzf
[[keys.command]]
key = "prefix+shift+p"
command = "nvim \"$(fd --type f --hidden --exclude .git --exclude node_modules | fzf --preview 'bat --style=numbers --color=always {}')\""
popup = true
popup_title = "Find File"

# Live grep with ripgrep and fzf
[[keys.command]]
key = "prefix+/"
command = "nvim \"$(rg --files-with-matches '' 2>/dev/null | fzf --preview 'rg --color=always --context=3 {} {q}' --bind 'change:reload:rg --files-with-matches {q} 2>/dev/null || true')\""
popup = true
popup_title = "Live Grep"

# Quick notes/scratch pad
[[keys.command]]
key = "prefix+shift+s"
command = "nvim ~/.scratch.md"
popup = true
popup_title = "Scratch Pad"

# Docker container management with lazydocker (if available)
[[keys.command]]
key = "prefix+shift+o"
command = "lazydocker"
popup = true
popup_title = "lazydocker"

# NPM scripts runner with fzf (for JavaScript projects)
[[keys.command]]
key = "prefix+shift+j"
command = "jq -r '.scripts | keys[]' package.json 2>/dev/null | fzf --preview 'jq -r \".scripts.{}\" package.json' | xargs -I {} npm run {}"
popup = true
popup_title = "NPM Scripts"

# Cursor agent launcher - start new coding agent session
[[keys.command]]
key = "prefix+shift+a"
command = "cursor --new-window ."
popup = false

# Open current directory in file manager (works on Linux with xdg-open, macOS with open)
[[keys.command]]
key = "prefix+shift+e"
command = "open . 2>/dev/null || xdg-open . 2>/dev/null || explorer.exe ."
popup = false

# Reload shell environment (source rc files)
[[keys.command]]
key = "prefix+shift+."
command = "exec $SHELL -l"
popup = false

# =============================================================================
# Session Management
# =============================================================================
[session]
# Resume AI agents on session restore (key herdr feature)
resume_agents_on_restore = true

# =============================================================================
# Update Settings
# =============================================================================
[update]
channel = "stable"
version_check = true

# =============================================================================
# Workspace Command Keybindings
# =============================================================================
# Custom keybindings to quickly open project workspaces.
# These replace the tmux workspace configs from ~/.config/.lil-dotties/tmux/workspaces.conf
#
# Usage:
#   - prefix+F1-F12 for quick workspace access (F-keys avoid conflicts with numbered tabs)
#   - Each command creates a new workspace in the specified directory
#   - If the workspace for that directory already exists, herdr will focus it
#
# To add your own workspaces:
#   1. Copy one of the [[keys.command]] blocks below
#   2. Change the key binding (e.g., "prefix+f5")
#   3. Update --cwd to your project path
#   4. Update --label to your preferred workspace name
#   5. Update the description for the help panel
#
# Common project paths (customize these for your environment):
# - macOS: ~/Developer, ~/Projects, ~/Code
# - Linux: ~/projects, ~/dev, ~/code
# - Windows: C:\Users\<name>\source\repos

# Example: Dotfiles workspace (this repo)
[[keys.command]]
key = "prefix+f1"
type = "shell"
command = "herdr workspace create --cwd ~/.local/share/chezmoi --label dotfiles --no-focus || herdr workspace focus $(herdr workspace list | jq -r '.result.workspaces[] | select(.label == \"dotfiles\") | .workspace_id' | head -1)"
description = "open dotfiles workspace"

# Example: Home workspace (general terminal in home directory)
[[keys.command]]
key = "prefix+f2"
type = "shell"
command = "herdr workspace create --cwd ~ --label home --no-focus || herdr workspace focus $(herdr workspace list | jq -r '.result.workspaces[] | select(.label == \"home\") | .workspace_id' | head -1)"
description = "open home workspace"

