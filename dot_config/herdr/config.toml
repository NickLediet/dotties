# =============================================================================
# Utility Commands
# =============================================================================

# Quick lazygit popup (if installed)
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit || echo 'lazygit not installed: brew install lazygit'"
description = "open lazygit"
width = "90%"
height = "90%"

# Quick scratch terminal popup
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal popup"
width = "80%"
height = "80%"
