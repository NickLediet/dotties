# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# Lazygit configuration
# https://github.com/jesseduffield/lazygit
#
# Managed by chezmoi. Applied to ~/.config/lazygit/config.yml
# macOS and Windows pick this up via LG_CONFIG_FILE (set in zshrc / PowerShell profile).

gui:
  nerdFontsVersion: "3"
  border: rounded
  # Catppuccin Mocha (blue accent) — matches tmux, nvim, and herdr
  # https://github.com/catppuccin/lazygit
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  authorColors:
    "*": "#b4befe"

os:
  editPreset: "nvim"
