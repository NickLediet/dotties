set -g default-terminal 'tmux-256color'
set-option -ga terminal-features ',xterm*:RGB'
set -g default-terminal 'screen-256color-bce'
set-option -ga terminal-features ',screen-256color-bce:RGB'

set -g mouse on

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Enable mode keys for vi like copy/paste
setw -g mode-keys vi
bind 'v' copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind P paste-buffer

# Cross-platform clipboard support
# Detect clipboard command based on platform:
#   - macOS: pbcopy (native)
#   - Linux/X11: xclip or xsel
#   - Linux/Wayland: wl-copy
#   - WSL: clip.exe
#
# Priority: WSL > Wayland > X11 (xclip) > X11 (xsel) > macOS

# WSL detection (clip.exe available and we're in WSL)
if-shell 'test -n "$WSL_DISTRO_NAME" && command -v clip.exe >/dev/null 2>&1' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
}

# Wayland (wl-copy available and WAYLAND_DISPLAY set)
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
}

# X11 with xclip
if-shell 'test -n "$DISPLAY" && command -v xclip >/dev/null 2>&1' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# X11 with xsel (fallback if xclip not available)
if-shell 'test -n "$DISPLAY" && ! command -v xclip >/dev/null 2>&1 && command -v xsel >/dev/null 2>&1' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
}

# macOS (pbcopy is native, no DISPLAY needed)
if-shell 'command -v pbcopy >/dev/null 2>&1 && test -z "$WSL_DISTRO_NAME"' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# Start windows and panes at 1, not 0
set -g base-index 0
set -g pane-base-index 0
set-window-option -g pane-base-index 0
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor 'mocha' # latte,frappe, macchiato or mocha
# Config inspired by: https://github.com/89iuv/dotfiles/blob/master/tmux/.tmux.conf

# status format
set -g @catppuccin_status_background "default"
set -g @catppuccin_status_connect_separator "yes"

# window icons
set -g @catppuccin_icon_window_last "󰖰 "
set -g @catppuccin_icon_window_zoom "󰁌 "
set -g @catppuccin_icon_window_mark "󰃀 "
set -g @catppuccin_icon_window_silent "󰂛 "
set -g @catppuccin_icon_window_activity "󱅫 "
set -g @catppuccin_icon_window_bell "󰂞 "

# window format
set -g @catppuccin_window_separator " "
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_middle_separator "█ "
set -g @catppuccin_window_status "text"

# window default format
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#{b:pane_current_path}"

# window current format
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{pane_current_path}"

# status modules list
set -g @catppuccin_status_modules_right "application session date_time"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"

# config for date_time module
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M:%S"

# Source workspace configs (untracked, for local customization)
# NOTE: Workspace keybindings have been ported to herdr. See ~/.config/herdr/config.toml
# for [[keys.command]] workspace definitions. For herdr users, these tmux workspace
# configs are no longer needed. This line is kept for backward compatibility with
# existing tmux-only setups.
if-shell "test -e ~/.config/.lil-dotties/tmux/workspaces.conf" "source-file ~/.config/.lil-dotties/tmux/workspaces.conf"


# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
